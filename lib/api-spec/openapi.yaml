openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Curvy Rails read-only demo API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: curvy-rails
    description: Curvy Rails storefront and community demo data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /curvy-rails/home:
    get:
      operationId: getCurvyRailsHome
      tags: [curvy-rails]
      summary: Get Curvy Rails homepage demo content
      responses:
        "200":
          description: Homepage content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeResponse"
  /curvy-rails/products:
    get:
      operationId: listCurvyRailsProducts
      tags: [curvy-rails]
      summary: List demo products with optional filters
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [women, men, new]
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Matching demo products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductsResponse"
  /curvy-rails/products/{slug}:
    get:
      operationId: getCurvyRailsProduct
      tags: [curvy-rails]
      summary: Get a demo product and its community content
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product and community content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetailResponse"
        "404":
          description: Product not found
  /curvy-rails/community:
    get:
      operationId: getCurvyRailsCommunity
      tags: [curvy-rails]
      summary: Get recent community demo activity
      responses:
        "200":
          description: Community activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityResponse"
  /curvy-rails/my-rail:
    get:
      operationId: getCurvyRailsMyRail
      tags: [curvy-rails]
      summary: Get the sample My Rail account
      responses:
        "200":
          description: Sample account dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyRailResponse"
  /curvy-rails/admin/overview:
    get:
      operationId: getCurvyRailsAdminOverview
      tags: [curvy-rails]
      summary: Get the sample admin overview
      responses:
        "200":
          description: Sample admin metrics and moderation queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverviewResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Product:
      type: object
      required:
        - id
        - slug
        - name
        - price
        - category
        - productType
        - colour
        - sizes
        - stock
        - description
        - sizeNote
        - imageUrl
        - imageAlt
        - isNew
        - verifiedOwnerCount
        - helpfulExperienceCount
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        price:
          type: number
        compareAtPrice:
          type: ["number", "null"]
        category:
          type: string
        productType:
          type: string
          enum: [women, men]
        colour:
          type: string
        sizes:
          type: array
          items:
            type: string
        stock:
          type: integer
        description:
          type: string
        sizeNote:
          type: string
        imageUrl:
          type: string
        imageAlt:
          type: string
        isNew:
          type: boolean
        verifiedOwnerCount:
          type: integer
        helpfulExperienceCount:
          type: integer
    ProductExperience:
      type: object
      required:
        - id
        - productSlug
        - authorName
        - purchasedSize
        - fit
        - body
        - createdAt
        - helpfulCount
      properties:
        id:
          type: string
        productSlug:
          type: string
        authorName:
          type: string
        purchasedSize:
          type: string
        usualSize:
          type: ["string", "null"]
        fit:
          type: string
          enum: [runs-small, just-right, runs-large]
        height:
          type: ["string", "null"]
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        photoUrl:
          type: ["string", "null"]
        photoAlt:
          type: ["string", "null"]
        helpfulCount:
          type: integer
    ProductAnswer:
      type: object
      required:
        - id
        - authorName
        - verifiedOwner
        - body
        - createdAt
        - helpfulCount
      properties:
        id:
          type: string
        authorName:
          type: string
        verifiedOwner:
          type: boolean
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        helpfulCount:
          type: integer
    ProductQuestion:
      type: object
      required:
        - id
        - productSlug
        - askerName
        - body
        - createdAt
        - answers
      properties:
        id:
          type: string
        productSlug:
          type: string
        askerName:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        answers:
          type: array
          items:
            $ref: "#/components/schemas/ProductAnswer"
    CommunitySummary:
      type: object
      required:
        - memberCount
        - helpfulCount
        - experienceCount
        - questionCount
      properties:
        memberCount:
          type: integer
        helpfulCount:
          type: integer
        experienceCount:
          type: integer
        questionCount:
          type: integer
    HomeResponse:
      type: object
      required:
        - justLanded
        - experiences
        - questions
        - summary
      properties:
        justLanded:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        experiences:
          type: array
          items:
            $ref: "#/components/schemas/ProductExperience"
        questions:
          type: array
          items:
            $ref: "#/components/schemas/ProductQuestion"
        summary:
          $ref: "#/components/schemas/CommunitySummary"
    ProductsResponse:
      type: object
      required:
        - items
        - categories
        - sizes
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        categories:
          type: array
          items:
            type: string
        sizes:
          type: array
          items:
            type: string
    ProductDetailResponse:
      type: object
      required:
        - product
        - experiences
        - questions
        - relatedProducts
      properties:
        product:
          $ref: "#/components/schemas/Product"
        experiences:
          type: array
          items:
            $ref: "#/components/schemas/ProductExperience"
        questions:
          type: array
          items:
            $ref: "#/components/schemas/ProductQuestion"
        relatedProducts:
          type: array
          items:
            $ref: "#/components/schemas/Product"
    CommunityResponse:
      type: object
      required:
        - summary
        - experiences
        - questions
      properties:
        summary:
          $ref: "#/components/schemas/CommunitySummary"
        experiences:
          type: array
          items:
            $ref: "#/components/schemas/ProductExperience"
        questions:
          type: array
          items:
            $ref: "#/components/schemas/ProductQuestion"
    DemoOrderItem:
      type: object
      required: [productName, size, quantity]
      properties:
        productName:
          type: string
        size:
          type: string
        quantity:
          type: integer
    DemoOrder:
      type: object
      required: [id, date, status, total, items]
      properties:
        id:
          type: string
        date:
          type: string
          format: date
        status:
          type: string
        total:
          type: number
        items:
          type: array
          items:
            $ref: "#/components/schemas/DemoOrderItem"
    RailActivity:
      type: object
      required: [id, description, date, stars]
      properties:
        id:
          type: string
        description:
          type: string
        date:
          type: string
          format: date
        stars:
          type: integer
    WalletSummary:
      type: object
      required: [currentStars, earnedStars, redeemedStars, pendingStars, availableCredit, history]
      properties:
        currentStars:
          type: integer
        earnedStars:
          type: integer
        redeemedStars:
          type: integer
        pendingStars:
          type: integer
        availableCredit:
          type: number
        history:
          type: array
          items:
            $ref: "#/components/schemas/RailActivity"
    DemoCustomer:
      type: object
      required: [firstName, lastName, email, joinedAt]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        whatnotUsername:
          type: ["string", "null"]
        joinedAt:
          type: string
          format: date
    MyRailResponse:
      type: object
      required: [customer, orders, ownedProducts, activity, wallet]
      properties:
        customer:
          $ref: "#/components/schemas/DemoCustomer"
        orders:
          type: array
          items:
            $ref: "#/components/schemas/DemoOrder"
        ownedProducts:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        activity:
          type: array
          items:
            $ref: "#/components/schemas/RailActivity"
        wallet:
          $ref: "#/components/schemas/WalletSummary"
    AdminMetrics:
      type: object
      required:
        - orders
        - revenue
        - customers
        - newMembers
        - experiences
        - questions
        - helpfulInteractions
        - photos
        - starsIssued
        - starsRedeemed
      properties:
        orders:
          type: integer
        revenue:
          type: number
        customers:
          type: integer
        newMembers:
          type: integer
        experiences:
          type: integer
        questions:
          type: integer
        helpfulInteractions:
          type: integer
        photos:
          type: integer
        starsIssued:
          type: integer
        starsRedeemed:
          type: integer
    ModerationQueueItem:
      type: object
      required: [id, type, summary, status, reportedAt]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [experience, photo, question, answer]
        summary:
          type: string
        status:
          type: string
          enum: [pending, reported, approved]
        reportedAt:
          type: string
          format: date-time
    AdminOverviewResponse:
      type: object
      required: [metrics, moderationQueue]
      properties:
        metrics:
          $ref: "#/components/schemas/AdminMetrics"
        moderationQueue:
          type: array
          items:
            $ref: "#/components/schemas/ModerationQueueItem"

