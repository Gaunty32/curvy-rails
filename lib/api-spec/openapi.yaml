openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Sales Order System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: customers
    description: Customer management
  - name: products
    description: Product management
  - name: suppliers
    description: Supplier management
  - name: orders
    description: Order management
  - name: shop
    description: Public shop endpoints (no auth required)
  - name: manufacturing
    description: Phase 1 manufacturing components, stock ledger, and BOM authoring (staff-gated)

paths:
  /manufacturing/components:
    get:
      operationId: listManufacturingComponents
      tags: [manufacturing]
      summary: List physical manufacturing components
      responses:
        "200":
          description: Components
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ManufacturingComponent" } }
    post:
      operationId: createManufacturingComponent
      tags: [manufacturing]
      summary: Create a component with zero opening stock
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManufacturingComponentInput" }
      responses:
        "201":
          description: Created component
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManufacturingComponent" }
        "400": { description: Invalid input }
        "409": { description: SKU already exists }
  /manufacturing/components/{id}:
    patch:
      operationId: updateManufacturingComponent
      tags: [manufacturing]
      summary: Update component metadata without changing stock
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManufacturingComponentUpdate" }
      responses:
        "200":
          description: Updated component
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManufacturingComponent" }
        "400": { description: Invalid input }
        "404": { description: Component not found }
        "409": { description: SKU already exists }
  /manufacturing/components/{id}/movements:
    get:
      operationId: listManufacturingComponentMovements
      tags: [manufacturing]
      summary: List the append-only stock ledger for a component
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Stock movements, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ManufacturingStockMovement" } }
        "404": { description: Component not found }
  /manufacturing/components/{id}/opening-balance:
    post:
      operationId: recordManufacturingOpeningBalance
      tags: [manufacturing]
      summary: Record the one-time counted opening component balance
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManufacturingOpeningBalanceInput" }
      responses:
        "201":
          description: Opening balance movement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManufacturingStockMovement" }
        "400": { description: Invalid input }
        "404": { description: Component not found }
        "409": { description: Opening balance already recorded }
  /manufacturing/components/{id}/stocktakes:
    get:
      operationId: listManufacturingComponentStocktakes
      tags: [manufacturing]
      summary: List stocktake drafts and approval history for a component
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Stocktakes newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ManufacturingStocktake" } }
        "404": { description: Component not found }
    post:
      operationId: createManufacturingStocktake
      tags: [manufacturing]
      summary: Create a stocktake draft against the current expected balance
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManufacturingStocktakeInput" }
      responses:
        "201":
          description: Draft stocktake
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManufacturingStocktake" }
        "400": { description: Invalid input }
        "404": { description: Component not found }
  /manufacturing/stocktakes/{id}/approve:
    post:
      operationId: approveManufacturingStocktake
      tags: [manufacturing]
      summary: Approve stocktake and record its variance movement
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Approved stocktake and optional variance movement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManufacturingStocktakeApproval" }
        "404": { description: Stocktake not found }
        "409": { description: Already approved or expected stock changed since draft }
  /manufacturing/variants/{variantId}/classification:
    patch:
      operationId: classifyManufacturingVariantInventory
      tags: [manufacturing]
      summary: Set a variant's inventory classification label
      description: Staff-only review/classification label. This does not transfer, rewrite, or otherwise change the variant's existing stock quantity or any component balance.
      security:
        - bearerAuth: []
      parameters:
        - { name: variantId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManufacturingVariantClassificationInput" }
      responses:
        "200":
          description: Classification label updated; stock quantity is returned unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManufacturingVariantClassificationResult" }
        "400": { description: Invalid variant ID or classification body }
        "401": { description: Staff authentication required }
        "404": { description: Variant not found }
  /manufacturing/variants/{variantId}/boms:
    get:
      operationId: listManufacturingVariantBoms
      tags: [manufacturing]
      summary: List immutable BOM versions for a sellable variant
      parameters:
        - { name: variantId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: BOM versions newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ManufacturingBom" } }
        "404": { description: Variant not found }
    post:
      operationId: createManufacturingVariantBom
      tags: [manufacturing]
      summary: Create a new immutable current BOM version
      parameters:
        - { name: variantId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManufacturingBomInput" }
      responses:
        "201":
          description: New current BOM version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManufacturingBom" }
        "400": { description: Invalid BOM or inactive/missing component }
        "404": { description: Variant not found }
        "409": { description: Concurrent version conflict }
  /shop/variants/{variantId}/availability:
    get:
      operationId: getShopVariantAvailability
      tags: [shop]
      summary: Read published variant component availability
      parameters:
        - { name: variantId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Customer-safe availability state without component-derived quantities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerVariantAvailability" }
        "404": { description: "Variant is unpublished, unsellable, or not explicitly enabled for component availability" }
  /manufacturing/variants/{variantId}/availability:
    get:
      operationId: getManufacturingVariantAvailability
      tags: [manufacturing]
      summary: Read authoritative staff availability for a variant
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: variantId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Component balances and immediate producibility
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManufacturingAvailability" }
        "401": { description: Staff authentication required }
        "404": { description: Variant not found }
  /manufacturing/variants/{variantId}/availability-policy:
    patch:
      operationId: updateManufacturingVariantAvailabilityPolicy
      tags: [manufacturing]
      summary: Configure explicit manufacturing eligibility and bounded replenishment
      description: Enabling requires an active current BOM and a recorded opening balance for every physical BOM component. Replenishment is disabled by default and requires component-level replenishable confirmation and lead days.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: variantId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManufacturingVariantAvailabilityPolicyInput" }
      responses:
        "200":
          description: Updated explicit variant policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManufacturingVariantPolicy" }
        "400": { description: Invalid policy }
        "401": { description: Staff authentication required }
        "404": { description: Variant not found }
        "409": { description: BOM or opened component stock requirement not satisfied }
  /manufacturing/policy:
    get:
      operationId: getManufacturingAvailabilityPolicy
      tags: [manufacturing]
      summary: Read shared low-stock threshold and checkout hold duration
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current availability defaults
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManufacturingAvailabilityPolicy" }
        "401": { description: Staff authentication required }
    patch:
      operationId: updateManufacturingAvailabilityPolicy
      tags: [manufacturing]
      summary: Configure shared low-stock threshold and checkout hold duration
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManufacturingAvailabilityPolicyInput" }
      responses:
        "200":
          description: Updated policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManufacturingAvailabilityPolicy" }
        "400": { description: Invalid policy }
        "401": { description: Staff authentication required }
  /manufacturing/components/{id}/balances:
    get:
      operationId: getManufacturingComponentBalances
      tags: [manufacturing]
      summary: Inspect physical, held, allocated, and available component quantities
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Current component consumption breakdown
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManufacturingComponentBalances" }
        "401": { description: Staff authentication required }
        "404": { description: Component not found }
  /manufacturing/orders/{id}/readiness:
    get:
      operationId: getManufacturingOrderReadiness
      tags: [manufacturing]
      summary: Report component allocation readiness and shortfalls for an order
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Component readiness by order item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManufacturingOrderReadiness" }
        "401": { description: Staff authentication required }
        "404": { description: Order not found }

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /callback:
    post:
      operationId: submitCallback
      tags: [callback]
      summary: Submit a callback request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallbackInput"
      responses:
        "200":
          description: Callback accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallbackResponse"
        "400": { description: Invalid request }
        "429": { description: Rate limited }
        "502":
          description: Request saved but HighLevel delivery failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallbackResponse"
        "503": { description: Callback service temporarily unavailable }
  /callback/{id}:
    get:
      operationId: getCallbackStatus
      tags: [callback]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Callback status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallbackStatus"
  /callback/availability:
    get:
      operationId: getCallbackAvailability
      tags: [callback]
      responses:
        "200":
          description: Current callback availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallbackAvailability"
  /admin/callbacks:
    get:
      operationId: listCallbacks
      tags: [callback]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [today, "7", "30"], default: "30" }
        - name: status
          in: query
          schema: { type: string }
        - name: source
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Callback requests
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CallbackAdminRow" } }
  /admin/callbacks/stats:
    get:
      operationId: getCallbackStats
      tags: [callback]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Callback statistics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallbackStats" }
  /admin/callbacks/settings:
    get:
      operationId: getCallbackSettings
      tags: [callback]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallbackSettingsResponse" }
    patch:
      operationId: updateCallbackSettings
      tags: [callback]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CallbackSettingsInput" }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallbackSettingsResponse" }
  /admin/callbacks/{id}/retry:
    post:
      operationId: retryCallback
      tags: [callback]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Retry result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetryCallbackResponse" }

  # ─── Customers ───────────────────────────────────────────────────────────────
  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List all customers
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a new customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerBody"
      responses:
        "201":
          description: Customer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get a customer by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateCustomer
      tags: [customers]
      summary: Update a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerBody"
      responses:
        "200":
          description: Customer updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteCustomer
      tags: [customers]
      summary: Delete a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Products ────────────────────────────────────────────────────────────────
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a new product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductBody"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductBody"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/{id}/website-publication:
    patch:
      operationId: updateProductWebsitePublication
      tags: [products]
      summary: Publish or hide a product on the shop
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebsitePublicationUpdate"
      responses:
        "200":
          description: Website publication updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Publication is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Suppliers ───────────────────────────────────────────────────────────────
  /suppliers:
    get:
      operationId: listSuppliers
      tags: [suppliers]
      summary: List all suppliers
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of suppliers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Supplier"
    post:
      operationId: createSupplier
      tags: [suppliers]
      summary: Create a new supplier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSupplierBody"
      responses:
        "201":
          description: Supplier created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /suppliers/{id}:
    get:
      operationId: getSupplier
      tags: [suppliers]
      summary: Get a supplier by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Supplier found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateSupplier
      tags: [suppliers]
      summary: Update a supplier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSupplierBody"
      responses:
        "200":
          description: Supplier updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteSupplier
      tags: [suppliers]
      summary: Delete a supplier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Orders ──────────────────────────────────────────────────────────────────
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List all orders
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: customerId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderBody"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get an order by ID (includes line items)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateOrder
      tags: [orders]
      summary: Update an order status or notes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderBody"
      responses:
        "200":
          description: Order updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteOrder
      tags: [orders]
      summary: Delete an order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/items:
    post:
      operationId: addOrderItem
      tags: [orders]
      summary: Add a line item to an order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderItemBody"
      responses:
        "201":
          description: Item added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderItem"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/items/{itemId}:
    patch:
      operationId: updateOrderItem
      tags: [orders]
      summary: Update a line item quantity or price
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderItemBody"
      responses:
        "200":
          description: Item updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteOrderItem
      tags: [orders]
      summary: Remove a line item from an order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [orders]
      summary: Get dashboard summary statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  # ─── Shop (public) ────────────────────────────────────────────────────────────
  /shop/settings:
    get:
      operationId: getShopSettings
      tags: [shop]
      summary: Get public shop branding and contact settings
      responses:
        "200":
          description: Shop settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopSettings"

  /shop/categories:
    get:
      operationId: listShopCategories
      tags: [shop]
      summary: List all product categories with product count
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShopCategory"

  /shop/products:
    get:
      operationId: listShopProducts
      tags: [shop]
      summary: List published shop products (public, no auth)
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: featured
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of shop products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShopProduct"

  /shop/products/{id}:
    get:
      operationId: getShopProduct
      tags: [shop]
      summary: Get a single shop product with full details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopProductDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /shop/enquiry:
    post:
      operationId: submitShopEnquiry
      tags: [shop]
      summary: Submit a quote / enquiry request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopEnquiryInput"
      responses:
        "200":
          description: Enquiry submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopEnquiryResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    ManufacturingComponent:
      type: object
      required: [id, sku, name, type, supplierId, supplierSku, costGbp, bin, reorderLevel, targetLevel, leadDays, active, replenishable, physicalBalance, createdAt, updatedAt]
      properties:
        id: { type: integer }
        sku: { type: string }
        name: { type: string }
        type: { type: string, enum: [garment, transfer, patch, packaging, other] }
        supplierId: { type: ["integer", "null"] }
        supplierSku: { type: ["string", "null"] }
        costGbp: { type: number }
        bin: { type: ["string", "null"] }
        reorderLevel: { type: integer }
        targetLevel: { type: integer }
        leadDays: { type: ["integer", "null"] }
        active: { type: boolean }
        replenishable: { type: boolean }
        physicalBalance: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ManufacturingComponentInput:
      type: object
      required: [sku, name, type]
      properties:
        sku: { type: string, minLength: 1, maxLength: 100 }
        name: { type: string, minLength: 1, maxLength: 250 }
        type: { type: string, enum: [garment, transfer, patch, packaging, other] }
        supplierId: { type: ["integer", "null"] }
        supplierSku: { type: ["string", "null"] }
        costGbp: { type: number, minimum: 0, default: 0 }
        bin: { type: ["string", "null"] }
        reorderLevel: { type: integer, minimum: 0, default: 0 }
        targetLevel: { type: integer, minimum: 0, default: 0 }
        leadDays: { type: ["integer", "null"], minimum: 0 }
        active: { type: boolean, default: true }
        replenishable: { type: boolean, default: false }
    ManufacturingComponentUpdate:
      type: object
      minProperties: 1
      properties:
        sku: { type: string, minLength: 1, maxLength: 100 }
        name: { type: string, minLength: 1, maxLength: 250 }
        type: { type: string, enum: [garment, transfer, patch, packaging, other] }
        supplierId: { type: ["integer", "null"] }
        supplierSku: { type: ["string", "null"] }
        costGbp: { type: number, minimum: 0 }
        bin: { type: ["string", "null"] }
        reorderLevel: { type: integer, minimum: 0 }
        targetLevel: { type: integer, minimum: 0 }
        leadDays: { type: ["integer", "null"], minimum: 0 }
        active: { type: boolean }
        replenishable: { type: boolean }
    ManufacturingAvailabilityComponent:
      type: object
      required: [componentId, sku, name, quantityPerUnit, physical, held, allocated, available, producibleQuantity]
      properties:
        componentId: { type: integer }
        sku: { type: string }
        name: { type: string }
        quantityPerUnit: { type: integer }
        physical: { type: integer }
        held: { type: integer }
        allocated: { type: integer }
        available: { type: integer }
        producibleQuantity: { type: integer }
    ManufacturingAvailability:
      type: object
      required: [variantId, manufacturingEnabled, bomId, producibleQuantity, status, components]
      properties:
        variantId: { type: integer }
        manufacturingEnabled: { type: boolean }
        bomId: { type: ["integer", "null"] }
        producibleQuantity: { type: ["integer", "null"] }
        status: { type: string, enum: [IN_STOCK, LOW_STOCK, AVAILABLE_TO_ORDER, OUT_OF_STOCK, LEGACY] }
        components:
          type: array
          items: { $ref: "#/components/schemas/ManufacturingAvailabilityComponent" }
    CustomerVariantAvailability:
      type: object
      required: [variantId, manufacturingEnabled, status]
      properties:
        variantId: { type: integer }
        manufacturingEnabled: { type: boolean, enum: [true] }
        status: { type: string, enum: [IN_STOCK, LOW_STOCK, AVAILABLE_TO_ORDER, OUT_OF_STOCK] }
    ManufacturingVariantAvailabilityPolicyInput:
      type: object
      additionalProperties: false
      required: [allowOrderToReplenish, maxOutstandingReplenishmentUnits, promisedReplenishmentDays]
      properties:
        manufacturingEnabled: { type: boolean }
        allowOrderToReplenish: { type: boolean }
        maxOutstandingReplenishmentUnits: { type: integer, minimum: 0 }
        promisedReplenishmentDays: { type: integer, minimum: 0 }
    ManufacturingVariantPolicy:
      type: object
      required: [id, manufacturingEnabled, allowOrderToReplenish, maxOutstandingReplenishmentUnits, promisedReplenishmentDays]
      properties:
        id: { type: integer }
        manufacturingEnabled: { type: boolean }
        allowOrderToReplenish: { type: boolean }
        maxOutstandingReplenishmentUnits: { type: integer }
        promisedReplenishmentDays: { type: integer }
    ManufacturingAvailabilityPolicyInput:
      type: object
      additionalProperties: false
      required: [lowStockThreshold, holdDurationMinutes]
      properties:
        lowStockThreshold: { type: integer, minimum: 0 }
        holdDurationMinutes: { type: integer, minimum: 1, maximum: 1440 }
    ManufacturingAvailabilityPolicy:
      type: object
      required: [id, lowStockThreshold, holdDurationMinutes]
      properties:
        id: { type: integer }
        lowStockThreshold: { type: integer }
        holdDurationMinutes: { type: integer }
    ManufacturingHoldSummary:
      type: object
      required: [id, paymentIntentId, lineIndex, variantId, bomId, componentId, requiredQuantity, heldQuantity, shortfallQuantity, status, expiresAt]
      properties:
        id: { type: integer }
        paymentIntentId: { type: string }
        lineIndex: { type: integer }
        variantId: { type: integer }
        bomId: { type: integer }
        componentId: { type: integer }
        requiredQuantity: { type: integer }
        heldQuantity: { type: integer }
        shortfallQuantity: { type: integer }
        status: { type: string, enum: [ACTIVE, CONVERTED, RELEASED, EXPIRED] }
        expiresAt: { type: string, format: date-time }
    ManufacturingAllocationSummary:
      type: object
      required: [id, orderId, orderItemId, variantId, bomId, componentId, requiredQuantity, allocatedQuantity, shortfallQuantity, status, manualReviewRequired, manualReviewReason]
      properties:
        id: { type: integer }
        orderId: { type: integer }
        orderItemId: { type: integer }
        variantId: { type: integer }
        bomId: { type: integer }
        componentId: { type: integer }
        requiredQuantity: { type: integer }
        allocatedQuantity: { type: integer }
        shortfallQuantity: { type: integer }
        status: { type: string, enum: [CONFIRMED, RELEASED] }
        manualReviewRequired: { type: boolean }
        manualReviewReason: { type: ["string", "null"] }
    ManufacturingComponentBalances:
      type: object
      required: [componentId, sku, name, physical, held, allocated, available, holds, allocations]
      properties:
        componentId: { type: integer }
        sku: { type: string }
        name: { type: string }
        physical: { type: integer }
        held: { type: integer }
        allocated: { type: integer }
        available: { type: integer }
        holds: { type: array, items: { $ref: "#/components/schemas/ManufacturingHoldSummary" } }
        allocations: { type: array, items: { $ref: "#/components/schemas/ManufacturingAllocationSummary" } }
    ManufacturingOrderReadiness:
      type: object
      required: [orderId, readiness, items, manualReviewRequired]
      properties:
        orderId: { type: integer }
        readiness: { type: string, enum: [FULLY_ALLOCATED, PARTIALLY_ALLOCATED, WAITING_FOR_COMPONENTS] }
        manualReviewRequired: { type: boolean }
        items:
          type: array
          items:
            type: object
            required: [orderItemId, readiness, components, manualReviewRequired]
            properties:
              orderItemId: { type: integer }
              readiness: { type: string, enum: [FULLY_ALLOCATED, PARTIALLY_ALLOCATED, WAITING_FOR_COMPONENTS] }
              manualReviewRequired: { type: boolean }
              components:
                type: array
                items:
                  type: object
                  required: [componentId, sku, name, required, allocated, shortfall, status, manualReviewRequired, manualReviewReason]
                  properties:
                    componentId: { type: integer }
                    sku: { type: string }
                    name: { type: string }
                    required: { type: integer }
                    allocated: { type: integer }
                    shortfall: { type: integer }
                    status: { type: string, enum: [CONFIRMED, RELEASED] }
                    manualReviewRequired: { type: boolean }
                    manualReviewReason: { type: ["string", "null"] }
    ManufacturingVariantClassificationInput:
      type: object
      additionalProperties: false
      required: [classification]
      description: Classification is a label/review state only; it does not transfer or change stock.
      properties:
        classification:
          type: string
          enum: [LEGACY_REVIEW, FINISHED_STOCK, COMPONENT_STOCK]
    ManufacturingVariantClassificationResult:
      type: object
      additionalProperties: false
      required: [variantId, classification, stockQuantity]
      description: Classification label plus the unchanged legacy stock quantity.
      properties:
        variantId: { type: integer }
        classification: { type: string, enum: [LEGACY_REVIEW, FINISHED_STOCK, COMPONENT_STOCK] }
        stockQuantity: { type: integer, description: Returned unchanged; classification does not transfer stock }
    ManufacturingOpeningBalanceInput:
      type: object
      required: [countedQuantity]
      properties:
        countedQuantity: { type: integer, minimum: 0 }
        note: { type: ["string", "null"], maxLength: 2000 }
    ManufacturingStocktakeInput:
      type: object
      required: [countedQuantity]
      properties:
        countedQuantity: { type: integer, minimum: 0 }
        note: { type: ["string", "null"], maxLength: 2000 }
    ManufacturingStockMovement:
      type: object
      required: [id, componentId, quantityChange, reason, actor, occurredAt, reference, note, resultingBalance]
      properties:
        id: { type: integer }
        componentId: { type: integer }
        quantityChange: { type: integer, description: Signed change; opening balance may be zero }
        reason: { type: string, enum: [OPENING_BALANCE, STOCKTAKE_ADJUSTMENT] }
        actor: { type: string }
        occurredAt: { type: string, format: date-time }
        reference: { type: ["string", "null"] }
        note: { type: ["string", "null"] }
        resultingBalance: { type: integer }
    ManufacturingStocktake:
      type: object
      required: [id, componentId, expectedQuantity, countedQuantity, movementRevision, status, createdBy, approvedBy, createdAt, approvedAt, note]
      properties:
        id: { type: integer }
        componentId: { type: integer }
        expectedQuantity: { type: integer }
        countedQuantity: { type: integer }
        movementRevision: { type: integer, description: Last immutable stock movement ID observed when the draft was created; -1 denotes unknown legacy state }
        status: { type: string, enum: [draft, approved] }
        createdBy: { type: string }
        approvedBy: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        approvedAt: { type: ["string", "null"], format: date-time }
        note: { type: ["string", "null"] }
    ManufacturingStocktakeApproval:
      type: object
      required: [stocktake, movement]
      properties:
        stocktake: { $ref: "#/components/schemas/ManufacturingStocktake" }
        movement:
          oneOf:
            - { $ref: "#/components/schemas/ManufacturingStockMovement" }
            - { type: "null" }
    ManufacturingBomComponentInput:
      type: object
      required: [componentId, quantity]
      properties:
        componentId: { type: integer, minimum: 1 }
        quantity: { type: integer, minimum: 1 }
    ManufacturingBomOperationInput:
      type: object
      required: [method]
      properties:
        method: { type: string, minLength: 1, maxLength: 120 }
        designRef: { type: ["string", "null"], maxLength: 250 }
        position: { type: ["string", "null"], maxLength: 250 }
        instructions: { type: ["string", "null"], maxLength: 4000 }
        labourAllowance: { type: number, minimum: 0, default: 0 }
        thumbnail: { type: ["string", "null"], maxLength: 2000 }
        sortOrder: { type: integer, default: 0 }
    ManufacturingBomInput:
      type: object
      required: [components]
      properties:
        components:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ManufacturingBomComponentInput" }
        operations:
          type: array
          items: { $ref: "#/components/schemas/ManufacturingBomOperationInput" }
    ManufacturingBomComponent:
      allOf:
        - $ref: "#/components/schemas/ManufacturingBomComponentInput"
        - type: object
          required: [id, bomId, componentSkuSnapshot, componentNameSnapshot, unitCostGbpSnapshot]
          properties:
            id: { type: integer }
            bomId: { type: integer }
            componentSkuSnapshot: { type: string, description: Component SKU frozen when this BOM version was created }
            componentNameSnapshot: { type: string, description: Component name frozen when this BOM version was created }
            unitCostGbpSnapshot: { type: number, description: GBP unit cost frozen when this BOM version was created }
    ManufacturingBomOperation:
      allOf:
        - $ref: "#/components/schemas/ManufacturingBomOperationInput"
        - type: object
          required: [id, bomId]
          properties:
            id: { type: integer }
            bomId: { type: integer }
    ManufacturingBom:
      type: object
      required: [id, variantId, version, isCurrent, createdBy, createdAt, components, operations]
      properties:
        id: { type: integer }
        variantId: { type: integer }
        version: { type: integer }
        isCurrent: { type: boolean }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        components:
          type: array
          items: { $ref: "#/components/schemas/ManufacturingBomComponent" }
        operations:
          type: array
          items: { $ref: "#/components/schemas/ManufacturingBomOperation" }
    CallbackInput:
      type: object
      properties:
        phone: { type: string }
        page_url: { type: string }
        page_title: { type: string }
        referrer: { type: string }
        session_id: { type: string }
        device_type: { type: string }
        utm_source: { type: string }
        utm_medium: { type: string }
        utm_campaign: { type: string }
        utm_content: { type: string }
        utm_term: { type: string }
        gclid: { type: string }
        fbclid: { type: string }
        website_url: { type: string }
        form_started_at: { type: integer }
      required: [phone]
    CallbackResponse:
      type: object
      properties:
        success: { type: boolean }
        callback_request_id: { type: string }
        business_open: { type: boolean }
        callback_type: { type: string, enum: [immediate, scheduled] }
        status: { type: string }
      required: [success, callback_request_id, business_open, callback_type, status]
    CallbackAvailability:
      type: object
      properties:
        business_open: { type: boolean }
        callback_type: { type: string, enum: [immediate, scheduled] }
        timezone: { type: string }
      required: [business_open, callback_type, timezone]
    CallbackStatus:
      type: object
      properties:
        callbackRequestId: { type: string }
        status: { type: string }
        callbackType: { type: string }
        businessOpen: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [callbackRequestId, status]
    CallbackAdminRow:
      type: object
      properties:
        callbackRequestId: { type: string }
        phone: { type: string }
        phoneNormalised: { type: string }
        status: { type: string }
        callbackType: { type: string }
        businessOpen: { type: boolean }
        pageUrl: { type: ["string", "null"] }
        pageTitle: { type: ["string", "null"] }
        referrer: { type: ["string", "null"] }
        utmSource: { type: ["string", "null"] }
        utmMedium: { type: ["string", "null"] }
        utmCampaign: { type: ["string", "null"] }
        utmContent: { type: ["string", "null"] }
        utmTerm: { type: ["string", "null"] }
        gclid: { type: ["string", "null"] }
        fbclid: { type: ["string", "null"] }
        deviceType: { type: ["string", "null"] }
        source: { type: string }
        highlevelSentAt: { type: ["string", "null"], format: date-time }
        highlevelResponseStatus: { type: ["integer", "null"] }
        highlevelContactId: { type: ["string", "null"] }
        highlevelContactHttpStatus: { type: ["integer", "null"] }
        highlevelContactSucceeded: { type: ["boolean", "null"] }
        highlevelContactResponseBody: { type: ["string", "null"] }
        highlevelContactError: { type: ["string", "null"] }
        highlevelWorkflowId: { type: ["string", "null"] }
        highlevelWorkflowStatus: { type: ["string", "null"] }
        highlevelWorkflowHttpStatus: { type: ["integer", "null"] }
        highlevelWorkflowSucceeded: { type: ["boolean", "null"] }
        highlevelWorkflowResponseBody: { type: ["string", "null"] }
        highlevelWorkflowError: { type: ["string", "null"] }
        highlevelAttemptCount: { type: ["integer", "null"] }
        highlevelLastAttemptAt: { type: ["string", "null"], format: date-time }
        errorMessage: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
      required: [callbackRequestId, phone, phoneNormalised, status, callbackType, businessOpen, source, createdAt]
    CallbackStats:
      type: object
      properties:
        total: { type: integer }
        immediate: { type: integer }
        closed: { type: integer }
        failures: { type: integer }
        blocked: { type: integer }
    CallbackSettingsInput:
      type: object
      properties:
        hours: { $ref: "#/components/schemas/CallbackHours" }
        ip_limit: { type: integer, minimum: 1, maximum: 100 }
        phone_limit: { type: integer, minimum: 1, maximum: 100 }
      required: [hours, ip_limit, phone_limit]
    CallbackSettingsResponse:
      allOf:
        - $ref: "#/components/schemas/CallbackSettingsInput"
        - type: object
          properties:
            timezone: { type: string }
          required: [timezone]
    RetryCallbackResponse:
      type: object
      properties:
        success: { type: boolean }
        status: { type: string }
      required: [success, status]
    CallbackHours:
      type: object
      properties:
        monday: { $ref: "#/components/schemas/DayHours" }
        tuesday: { $ref: "#/components/schemas/DayHours" }
        wednesday: { $ref: "#/components/schemas/DayHours" }
        thursday: { $ref: "#/components/schemas/DayHours" }
        friday: { $ref: "#/components/schemas/DayHours" }
        saturday: { $ref: "#/components/schemas/DayHours" }
        sunday: { $ref: "#/components/schemas/DayHours" }
      required: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
    DayHours:
      type: ["object", "null"]
      properties:
        open: { type: string }
        close: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    # ─── Customer ──────────────────────────────────────────────────────────────
    Customer:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        contactFirstName:
          type: ["string", "null"]
        contactLastName:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        state:
          type: ["string", "null"]
        postcode:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        requiresPrepayment:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - contactFirstName
        - contactLastName
        - email
        - phone
        - address
        - city
        - state
        - postcode
        - notes
        - createdAt
