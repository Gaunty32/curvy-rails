openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Sales Order System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: customers
    description: Customer management
  - name: products
    description: Product management
  - name: suppliers
    description: Supplier management
  - name: orders
    description: Order management
  - name: shop
    description: Public shop endpoints (no auth required)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /callback:
    post:
      operationId: submitCallback
      tags: [callback]
      summary: Submit a callback request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallbackInput"
      responses:
        "200":
          description: Callback accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallbackResponse"
        "400": { description: Invalid request }
        "429": { description: Rate limited }
        "502":
          description: Request saved but HighLevel delivery failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallbackResponse"
        "503": { description: Callback service temporarily unavailable }
  /callback/{id}:
    get:
      operationId: getCallbackStatus
      tags: [callback]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Callback status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallbackStatus"
  /callback/availability:
    get:
      operationId: getCallbackAvailability
      tags: [callback]
      responses:
        "200":
          description: Current callback availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallbackAvailability"
  /admin/callbacks:
    get:
      operationId: listCallbacks
      tags: [callback]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [today, "7", "30"], default: "30" }
        - name: status
          in: query
          schema: { type: string }
        - name: source
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Callback requests
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CallbackAdminRow" } }
  /admin/callbacks/stats:
    get:
      operationId: getCallbackStats
      tags: [callback]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Callback statistics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallbackStats" }
  /admin/callbacks/settings:
    get:
      operationId: getCallbackSettings
      tags: [callback]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallbackSettingsResponse" }
    patch:
      operationId: updateCallbackSettings
      tags: [callback]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CallbackSettingsInput" }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallbackSettingsResponse" }
  /admin/callbacks/{id}/retry:
    post:
      operationId: retryCallback
      tags: [callback]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Retry result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetryCallbackResponse" }

  # ─── Customers ───────────────────────────────────────────────────────────────
  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List all customers
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a new customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerBody"
      responses:
        "201":
          description: Customer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get a customer by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateCustomer
      tags: [customers]
      summary: Update a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerBody"
      responses:
        "200":
          description: Customer updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteCustomer
      tags: [customers]
      summary: Delete a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Products ────────────────────────────────────────────────────────────────
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a new product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductBody"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductBody"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/{id}/website-publication:
    patch:
      operationId: updateProductWebsitePublication
      tags: [products]
      summary: Publish or hide a product on the shop
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebsitePublicationUpdate"
      responses:
        "200":
          description: Website publication updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Publication is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Suppliers ───────────────────────────────────────────────────────────────
  /suppliers:
    get:
      operationId: listSuppliers
      tags: [suppliers]
      summary: List all suppliers
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of suppliers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Supplier"
    post:
      operationId: createSupplier
      tags: [suppliers]
      summary: Create a new supplier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSupplierBody"
      responses:
        "201":
          description: Supplier created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /suppliers/{id}:
    get:
      operationId: getSupplier
      tags: [suppliers]
      summary: Get a supplier by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Supplier found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateSupplier
      tags: [suppliers]
      summary: Update a supplier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSupplierBody"
      responses:
        "200":
          description: Supplier updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteSupplier
      tags: [suppliers]
      summary: Delete a supplier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Orders ──────────────────────────────────────────────────────────────────
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List all orders
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: customerId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderBody"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get an order by ID (includes line items)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateOrder
      tags: [orders]
      summary: Update an order status or notes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderBody"
      responses:
        "200":
          description: Order updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteOrder
      tags: [orders]
      summary: Delete an order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/items:
    post:
      operationId: addOrderItem
      tags: [orders]
      summary: Add a line item to an order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderItemBody"
      responses:
        "201":
          description: Item added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderItem"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/items/{itemId}:
    patch:
      operationId: updateOrderItem
      tags: [orders]
      summary: Update a line item quantity or price
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderItemBody"
      responses:
        "200":
          description: Item updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteOrderItem
      tags: [orders]
      summary: Remove a line item from an order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [orders]
      summary: Get dashboard summary statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  # ─── Shop (public) ────────────────────────────────────────────────────────────
  /shop/settings:
    get:
      operationId: getShopSettings
      tags: [shop]
      summary: Get public shop branding and contact settings
      responses:
        "200":
          description: Shop settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopSettings"

  /shop/categories:
    get:
      operationId: listShopCategories
      tags: [shop]
      summary: List all product categories with product count
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShopCategory"

  /shop/products:
    get:
      operationId: listShopProducts
      tags: [shop]
      summary: List published shop products (public, no auth)
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: featured
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of shop products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShopProduct"

  /shop/products/{id}:
    get:
      operationId: getShopProduct
      tags: [shop]
      summary: Get a single shop product with full details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopProductDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /shop/enquiry:
    post:
      operationId: submitShopEnquiry
      tags: [shop]
      summary: Submit a quote / enquiry request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopEnquiryInput"
      responses:
        "200":
          description: Enquiry submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopEnquiryResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    CallbackInput:
      type: object
      properties:
        phone: { type: string }
        page_url: { type: string }
        page_title: { type: string }
        referrer: { type: string }
        session_id: { type: string }
        device_type: { type: string }
        utm_source: { type: string }
        utm_medium: { type: string }
        utm_campaign: { type: string }
        utm_content: { type: string }
        utm_term: { type: string }
        gclid: { type: string }
        fbclid: { type: string }
        website_url: { type: string }
        form_started_at: { type: integer }
      required: [phone]
    CallbackResponse:
      type: object
      properties:
        success: { type: boolean }
        callback_request_id: { type: string }
        business_open: { type: boolean }
        callback_type: { type: string, enum: [immediate, scheduled] }
        status: { type: string }
      required: [success, callback_request_id, business_open, callback_type, status]
    CallbackAvailability:
      type: object
      properties:
        business_open: { type: boolean }
        callback_type: { type: string, enum: [immediate, scheduled] }
        timezone: { type: string }
      required: [business_open, callback_type, timezone]
    CallbackStatus:
      type: object
      properties:
        callbackRequestId: { type: string }
        status: { type: string }
        callbackType: { type: string }
        businessOpen: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [callbackRequestId, status]
    CallbackAdminRow:
      type: object
      properties:
        callbackRequestId: { type: string }
        phone: { type: string }
        phoneNormalised: { type: string }
        status: { type: string }
        callbackType: { type: string }
        businessOpen: { type: boolean }
        pageUrl: { type: ["string", "null"] }
        pageTitle: { type: ["string", "null"] }
        referrer: { type: ["string", "null"] }
        utmSource: { type: ["string", "null"] }
        utmMedium: { type: ["string", "null"] }
        utmCampaign: { type: ["string", "null"] }
        utmContent: { type: ["string", "null"] }
        utmTerm: { type: ["string", "null"] }
        gclid: { type: ["string", "null"] }
        fbclid: { type: ["string", "null"] }
        deviceType: { type: ["string", "null"] }
        source: { type: string }
        highlevelSentAt: { type: ["string", "null"], format: date-time }
        highlevelResponseStatus: { type: ["integer", "null"] }
        highlevelContactId: { type: ["string", "null"] }
        highlevelContactHttpStatus: { type: ["integer", "null"] }
        highlevelContactSucceeded: { type: ["boolean", "null"] }
        highlevelContactResponseBody: { type: ["string", "null"] }
        highlevelContactError: { type: ["string", "null"] }
        highlevelWorkflowId: { type: ["string", "null"] }
        highlevelWorkflowStatus: { type: ["string", "null"] }
        highlevelWorkflowHttpStatus: { type: ["integer", "null"] }
        highlevelWorkflowSucceeded: { type: ["boolean", "null"] }
        highlevelWorkflowResponseBody: { type: ["string", "null"] }
        highlevelWorkflowError: { type: ["string", "null"] }
        highlevelAttemptCount: { type: ["integer", "null"] }
        highlevelLastAttemptAt: { type: ["string", "null"], format: date-time }
        errorMessage: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
      required: [callbackRequestId, phone, phoneNormalised, status, callbackType, businessOpen, source, createdAt]
    CallbackStats:
      type: object
      properties:
        total: { type: integer }
        immediate: { type: integer }
        closed: { type: integer }
        failures: { type: integer }
        blocked: { type: integer }
    CallbackSettingsInput:
      type: object
      properties:
        hours: { $ref: "#/components/schemas/CallbackHours" }
        ip_limit: { type: integer, minimum: 1, maximum: 100 }
        phone_limit: { type: integer, minimum: 1, maximum: 100 }
      required: [hours, ip_limit, phone_limit]
    CallbackSettingsResponse:
      allOf:
        - $ref: "#/components/schemas/CallbackSettingsInput"
        - type: object
          properties:
            timezone: { type: string }
          required: [timezone]
    RetryCallbackResponse:
      type: object
      properties:
        success: { type: boolean }
        status: { type: string }
      required: [success, status]
    CallbackHours:
      type: object
      properties:
        monday: { $ref: "#/components/schemas/DayHours" }
        tuesday: { $ref: "#/components/schemas/DayHours" }
        wednesday: { $ref: "#/components/schemas/DayHours" }
        thursday: { $ref: "#/components/schemas/DayHours" }
        friday: { $ref: "#/components/schemas/DayHours" }
        saturday: { $ref: "#/components/schemas/DayHours" }
        sunday: { $ref: "#/components/schemas/DayHours" }
      required: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
    DayHours:
      type: ["object", "null"]
      properties:
        open: { type: string }
        close: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

