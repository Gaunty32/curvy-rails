kind = "web"
previewPath = "/"
title = "Curvy Rails"
description = "A community-led British clothing shop for plus-size menswear and womenswear, combining a welcoming product catalogue with customer fit experiences, questions, and helpful community contributions."
version = "1.0.0"
id = "artifacts/curvy-rails"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18783

[services.development]
run = "pnpm --filter @workspace/curvy-rails run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/curvy-rails", "run", "build" ]
serve = "static"
publicDir = "artifacts/curvy-rails/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18783"
BASE_PATH = "/"
